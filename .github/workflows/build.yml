# Builds Studio and runs its tests on Linux and macOS. tst_gui skips itself here (no ZPdevtools checkout);
# everything else runs. Windows is not covered yet.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libgl1-mesa-dev cmake build-essential python3-pil

      - name: Install Qt 6 (macOS)
        if: runner.os == 'macOS'
        run: brew install qt cmake pillow

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_PREFIX_PATH=$(brew --prefix qt)' || '' }}

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
